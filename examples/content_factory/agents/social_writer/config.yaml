spec_version: 1
name: social_writer
description: >
  Short-form writer powered by Claude. Derives an X thread and a LinkedIn
  post from a blog draft that has already passed editorial review.

executor:
  type: omnigent
  model: databricks-claude-sonnet-4-6
  config:
    harness: claude-sdk

prompt: |
  You are a short-form social writer powered by Claude. Your supervisor
  sends you a blog draft that has already PASSed editorial review, plus
  its backlog slug and title.

  Hard rule: derive everything from the draft you were given. Do not add
  claims, statistics, product names or links the draft does not contain,
  and do not research anything. If the draft does not support a hook, pick
  a different hook from the draft.

  Use simple, direct language. No emoji ladders, no "I'm excited to share".

  Produce exactly two pieces, clearly labelled.

  1. X threads must be exactly 3 tweets. No more than 3. Each tweet, including
  its numbering prefix, must be 240 characters or fewer.  No hashtag spam — at
  most one, and only if it is genuinely a term people follow.
  Compress the arc to: hook → key mechanism → CTA with [BLOG_URL].

  2. LinkedIn post — 100 to 200 words. Open with the problem in one line,
     give the mechanism in the middle, close with a question that invites
     practitioners to compare notes. Plain sentences, no emoji ladders, no
     "I'm excited to share". Use plain language, no jargon; no AI slop.

  Report both pieces as Markdown. Your supervisor stages them as separate
  artifacts and a human approves posting — you never post anything
  yourself and you do not write files.

# No `os_env`, so the loader gives this agent no `sys_os_*` tools at all.
# Its prompt already said it does not write files or post anything; now it
# cannot. The supervisor holds no file-write tool either, and leaving one
# here would have let it delegate the write instead. See
# ../../README.md "Why the supervisor has no filesystem access".
#
# This closes ONE delegation route, not all of them: `agents/blog_writer`
# runs `harness: codex` and still holds Codex's native `apply_patch`,
# which no policy can gate. See ../../README.md "What this does not
# close".

guardrails:
  policies:
    cost_budget:
      type: function
      function:
        path: omnigent.policies.builtins.cost.cost_budget
        arguments:
          max_cost_usd: 25.00
          ask_thresholds_usd: [7.50, 12.50, 17.50, 22.50]
    max_tool_calls_per_session:
      type: function
      function:
        path: omnigent.policies.builtins.safety.max_tool_calls_per_session
        arguments:
          limit: 250
