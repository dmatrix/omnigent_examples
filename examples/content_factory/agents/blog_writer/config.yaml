spec_version: 1
name: blog_writer
description: >
  Blog drafter powered by OpenAI (Codex). Turns one backlog feature into
  a full blog draft, researching only the sources the backlog entry names.

executor:
  type: omnigent
  model: databricks-gpt-5-4
  config:
    harness: codex
    # Turns off Codex's native shell tool. This agent researches and returns
    # Markdown -- its prompt has always said it does not write files -- so a
    # shell is a capability it has no use for.
    #
    # PARTIAL, and the README says so. On the ordinary (non-brokered) Codex
    # route this sends only `features.shell_tool=false`
    # (omnigent/inner/codex_executor.py:4035). Verified against codex-cli
    # 0.149.1: that flips `shell_tool` and nothing else, and there is no
    # feature flag that disables the `apply_patch` tool. So Codex can still
    # edit files. See ../../README.md "What this does not close".
    disable_native_tools: true

prompt: |
  You are a technical blog writer powered by OpenAI. Your supervisor sends
  you ONE backlog feature — a slug, a title, a summary, and a `sources`
  list of URLs — plus an outline to work from.

  Research rule — a hard rule, not a preference:
  Research ONLY the URLs supplied in the backlog entry's sources list. If a
  source is missing or unreachable, say so in the draft rather than
  substituting another source. Do not search for unrelated material and do
  not fill gaps from training data — an honest gap beats an invented fact.

  Write the draft:
  - Open with the concrete problem the feature solves, no preamble.
  - Explain the mechanism before the benefits.
  - Include a short code or config example when the sources support one.
  - Close with what the reader should do next.
  - Target 800-1200 words with `##` headings, and attribute every specific
    claim to one of the supplied sources.

  Report the draft as Markdown, then list the sources you used and any you
  could not reach. Your supervisor stages it — you do not write files.

  On editor feedback, apply the changes under the same research rule and
  return the full revised draft.

# No `os_env`, so the loader gives this agent no `sys_os_*` tools. Verified
# by differential probe: removing the block changes nothing the Codex launch
# depends on -- the spawn env, resolved OSEnvSpec, sandbox mode and harness
# app are byte-identical before and after.
#
# It does narrow Codex's own sandbox. `_sandbox_mode`
# (omnigent/inner/codex_executor.py:2830-2838) maps `sandbox: {type: none}` to
# `danger-full-access` -- the whole filesystem -- and an absent `os_env` to
# `read-only`. So removing the block is a real reduction.
#
# But NOT a closure, and the README says so plainly: because this agent is
# passed AP-bridged tools, codex_executor.py:5494-5496 upgrades that
# `read-only` back to `workspace-write`, and the bundle sits in the workspace.
# Codex's `apply_patch` can therefore still rewrite this file. No Omnigent
# policy can stop it either: native Codex calls arrive marked
# `internally_executed` and have ALREADY run
# (omnigent/runtime/harnesses/_executor_adapter.py:1311-1313).

tools:
  builtins:
    - web_search

guardrails:
  policies:
    cost_budget:
      type: function
      function:
        path: omnigent.policies.builtins.cost.cost_budget
        arguments:
          max_cost_usd: 1.0
          ask_thresholds_usd: [0.25]
    max_tool_calls_per_session:
      type: function
      function:
        path: omnigent.policies.builtins.safety.max_tool_calls_per_session
        arguments:
          limit: 250
